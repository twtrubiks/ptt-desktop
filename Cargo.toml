[package]
name = "ptt-gpui"
version = "0.2.0"
edition = "2021"
description = "PTT 桌面客戶端（GPUI）"
authors = ["twtrubiks"]
license = "GPL-3.0-only"

[dependencies]
gpui = "0.2.2"
tungstenite = { version = "0.28", default-features = false, features = ["native-tls", "handshake"] }
native-tls = "0.2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
log = "0.4"
# net.rs 的 poll(2)：網路執行緒同時等 socket 與喚醒通道，按鍵不必等讀取逾時。
# gpui 本來就間接依賴同一版 libc，不增加下載或編譯單元
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
