name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_VERSION=$(jq -r '.version' package.json)

          echo "Tag version:     $TAG_VERSION"
          echo "Tauri version:   $TAURI_VERSION"
          echo "Cargo version:   $CARGO_VERSION"
          echo "package version: $PKG_VERSION"

          if [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json version ($TAURI_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "All versions match: $TAG_VERSION"

  release:
    needs: verify-version

    strategy:
      fail-fast: false
      matrix:
        include:
          # 用 22.04 當 baseline：24.04 建出的 binary 要求 GLIBC_2.38+，
          # 較舊的發行版（如 Ubuntu 22.04, glibc 2.35）跑不起來（issue #1）。
          # Tauri 官方也建議用最舊且仍有 WebKitGTK 4.1 的系統建置：
          # https://tauri.app/distribute/appimage/
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ptt-desktop ${{ github.ref_name }}"
          releaseBody: |
            ## 安裝方式

            ### Linux

            | 格式 | 安裝指令 |
            |------|----------|
            | AppImage | `chmod +x *.AppImage && ./*.AppImage` |
            | deb | `sudo dpkg -i *.deb` |
            | rpm | `sudo rpm -i *.rpm` |

            AppImage 若在 Wayland 下畫面異常，可退回 `GDK_BACKEND=x11 ./*.AppImage` 執行（此模式下中文輸入不可用）。

            ### macOS

            下載 `.dmg`（universal，支援 Apple Silicon 與 Intel）。未經 Apple 公證，首次開啟請在 Finder 對 App 按右鍵 →「打開」，或執行 `xattr -cr "/Applications/ptt-desktop.app"`。

            ### Windows

            下載 `.msi` 或 `.exe` 安裝。未簽章，首次執行 SmartScreen 會警告 → 點「更多資訊」→「仍要執行」。
          # 先建立 draft：三平台各自跑完才不會出現缺平台的公開 Release，確認齊全後手動 Publish
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # AppImage 預設有三個問題（deb/rpm 不受影響）：
      # 1. AppRun hook 強制 GDK_BACKEND=x11，關閉了 Wayland text-input（fcitx5/ibus）路徑
      # 2. 打包的 libwayland 過舊（來自建置平台 ubuntu-22.04），與新系統的 Mesa 符號衝突，
      #    Wayland backend 一啟動就 symbol lookup error（wl_display_create_queue_with_name）
      # 3. hook 的深色偵測只看 gtk-theme 名稱是否含 "dark"，但 KDE（Breeze）/GNOME 的深色
      #    是設在 color-scheme=prefer-dark，永遠判成 light → 強制 GTK_THEME=Adwaita:light，
      #    標題列、右鍵選單等原生 GTK 元件全變白色
      # 修法：移除強制 x11 + 移除打包的 libwayland（改用系統版）+ 深色偵測加入 color-scheme，
      # 重新打包後覆蓋 Release 資產
      - name: Patch AppImage (Wayland IME 中文輸入 + 深色主題偵測)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null

          # 確認上游 hook 仍有這行；若消失代表 Tauri 打包行為已變，此 patch 需重新檢視
          grep -q '^export GDK_BACKEND=x11' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          sed -i '/^export GDK_BACKEND=x11/d' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          rm -f squashfs-root/usr/lib/libwayland-*.so*

          # 深色偵測改成同時檢查 color-scheme 與 gtk-theme，任一含 "dark" 即用深色
          grep -q '^gsettings get org.gnome.desktop.interface gtk-theme' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          sed -i 's#^gsettings get org.gnome.desktop.interface gtk-theme.*#{ gsettings get org.gnome.desktop.interface color-scheme; gsettings get org.gnome.desktop.interface gtk-theme; } 2>/dev/null | grep -qi "dark" \&\& GTK_THEME_VARIANT="dark" || GTK_THEME_VARIANT="light"#' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh

          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"

          gh release upload "$GITHUB_REF_NAME" "$APPIMAGE" --clobber
