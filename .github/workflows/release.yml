name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # 用 22.04 當 baseline：較新系統建出的執行檔會要求較新的 glibc，
    # 舊一點的發行版跑不起來。
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            file \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libasound2-dev \
            libzstd-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build AppImage
        env:
          # runner 沒有 FUSE，讓 appimagetool 自行解開後執行
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" RUNTIME="$PWD/runtime-x86_64" scripts/build-appimage.sh

      # 先建立 draft，確認安裝檔沒問題後手動 Publish
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          GPUI 全 Rust 版，只支援 Linux（x86_64）。

          ## 安裝方式

          ```bash
          chmod +x ptt-gpui-*.AppImage && ./ptt-gpui-*.AppImage
          ```

          AppImage 只包執行檔，系統需要 `libssl3`、`libxkbcommon-x11-0`、Vulkan 驅動
          （`mesa-vulkan-drivers`）與 Noto Sans Mono CJK TC 字型（`fonts-noto-cjk`）。

          舊的 Tauri 2 + xterm.js 版（Linux／macOS／Windows）請下載
          [v0.1.7](https://github.com/twtrubiks/ptt-desktop/releases/tag/v0.1.7)。
          NOTES
          gh release create "$GITHUB_REF_NAME" target/appimage/*.AppImage \
            --draft \
            --title "ptt-desktop $GITHUB_REF_NAME" \
            --notes-file notes.md
